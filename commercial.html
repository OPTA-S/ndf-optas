async function unlock(){
 const pw=document.getElementById('pw').value; const err=document.getElementById('err'); err.textContent='';

 try{
  const raw=b64(BLOB); const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);

  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('optas_pw',pw);}catch(_){} document.open();document.write(html);document.close();
